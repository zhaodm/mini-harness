<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>L01 - 封面+摘要</title>
  <link rel="stylesheet" href="../../ppt-base.css">
</head>
<body>
  <div class="slide flex-col" data-layout="L01" data-slide-id="l01" data-layout-type="全屏大字">
    <!-- Top spacer -->
    <div style="flex:1"></div>

    <!-- Title Block -->
    <div style="text-align:center; margin-bottom:var(--spacing-xl)">
      <h1 style="font-size:48px; font-weight:700; color:var(--text-primary); margin-bottom:var(--spacing-xl)">
        项目季度总结报告
      </h1>
      <p style="font-size:var(--font-subtitle); color:var(--text-secondary)">
        2026 Q1 业务回顾与下季度规划
      </p>
    </div>

    <!-- Core Conclusions -->
    <div class="grid-4" style="margin:0 60px var(--spacing-xl)">
      <div class="card" style="border-left:3px solid var(--color-primary)">
        <div class="text-caption" style="margin-bottom:4px">营收增长</div>
        <div style="font-size:28px; font-weight:700; color:var(--color-primary)">+23.5%</div>
        <div class="text-caption">超额完成目标</div>
      </div>
      <div class="card" style="border-left:3px solid var(--color-secondary)">
        <div class="text-caption" style="margin-bottom:4px">用户规模</div>
        <div style="font-size:28px; font-weight:700; color:var(--color-secondary)">1.2M</div>
        <div class="text-caption">月活跃用户</div>
      </div>
      <div class="card" style="border-left:3px solid var(--color-positive)">
        <div class="text-caption" style="margin-bottom:4px">项目交付</div>
        <div style="font-size:28px; font-weight:700; color:var(--color-positive)">12/14</div>
        <div class="text-caption">按时交付率 86%</div>
      </div>
      <div class="card" style="border-left:3px solid var(--color-tertiary)">
        <div class="text-caption" style="margin-bottom:4px">团队满意度</div>
        <div style="font-size:28px; font-weight:700; color:var(--color-tertiary)">4.6/5</div>
        <div class="text-caption">环比提升 0.3</div>
      </div>
    </div>

    <!-- Bottom spacer -->
    <div style="flex:1"></div>

    <!-- Footer -->
    <div class="flex-between" style="padding-top:var(--spacing-md); border-top:1px solid var(--border-color)">
      <span class="text-caption">产品技术部</span>
      <span class="text-caption">2026年3月31日</span>
      <span class="text-caption">机密 · 内部使用</span>
    </div>
  </div>
</body>
</html>
